plugins {
    id "com.android.application"
}

android {
    namespace "com.example.lyricoverlay"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lyricoverlay"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // No extra dependencies needed (纯原生 Java/Android SDK).
}
